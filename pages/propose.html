<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposer une activité - Calendar</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Accueil</a>
            <a href="calendar.html">Calendrier</a>
            <a href="propose.html">Proposer</a>
            <div id="auth-menu"></div>
        </nav>
    </header>

    <main>
        <section class="activity-form-section">
            <h1>Proposer une activité</h1>
            <p>Votre proposition sera soumise à validation par un administrateur.</p>

            <form id="activity-form" class="activity-form">
                <div class="form-field">
                    <label for="activity-title">Activité / jeu *</label>
                    <input id="activity-title" name="title" type="text" maxlength="150" required>
                </div>

                <div class="form-field">
                    <label for="activity-description">Description</label>
                    <textarea id="activity-description" name="description" rows="5" maxlength="5000"></textarea>
                </div>

                <div class="form-grid">
                    <div class="form-field">
                        <label for="activity-date">Date *</label>
                        <input id="activity-date" name="date" type="date" required>
                    </div>
                    <div class="form-field">
                        <label for="activity-start-time">Début *</label>
                        <input id="activity-start-time" name="start_time" type="time" required>
                    </div>
                    <div class="form-field">
                        <label for="activity-end-time">Fin *</label>
                        <input id="activity-end-time" name="end_time" type="time" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-field">
                        <label for="activity-min-players">Joueurs minimum *</label>
                        <input id="activity-min-players" name="min_players" type="number" min="1" required>
                    </div>
                    <div class="form-field">
                        <label for="activity-max-players">Joueurs maximum *</label>
                        <input id="activity-max-players" name="max_players" type="number" min="1" required>
                    </div>
                </div>

                <div class="form-field">
                    <label for="activity-location">Lieu</label>
                    <input id="activity-location" name="location" type="text" maxlength="300" placeholder="Ex. Salle principale">
                </div>

                <label class="form-checkbox">
                    <input id="activity-is-event" name="is_event" type="checkbox">
                    <span>Marquer cette activité comme événement</span>
                </label>

                <div class="form-field">
                    <label for="activity-image">Image de l'activité</label>
                    <input id="activity-image" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif">
                    <small>Optionnelle · 1 image · 10 Mo maximum · JPG, PNG, WebP, GIF ou AVIF</small>
                    <div id="activity-image-preview" class="activity-image-preview-container"></div>
                </div>

                <button type="submit">Envoyer la proposition</button>
                <p id="activity-form-message" class="form-message" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/propose.js"></script>
</body>
</html>
