<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposer une activité</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>
    <nav>
        <a href="../index.html">Accueil</a>
        <a href="calendar.html">Calendrier</a>
        <a href="propose.html">Proposer</a>

        <div id="auth-menu"></div>
    </nav>
</header>

<main>
    <h1>Proposer une activité</h1>

    <form id="proposal-form">

        <div>
            <label for="title">Jeu / activité</label>
            <input
                type="text"
                id="title"
                name="title"
                required
                maxlength="100"
                placeholder="Ex. Catan"
            >
        </div>

        <div>
            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                maxlength="1000"
                placeholder="Décrivez rapidement la partie..."
            ></textarea>
        </div>

        <div>
            <label for="date">Date</label>
            <input
                type="date"
                id="date"
                name="date"
                required
            >
        </div>

        <div>
            <label for="start-time">Heure de début</label>
            <input
                type="time"
                id="start-time"
                name="start-time"
                required
            >
        </div>

        <div>
            <label for="end-time">Heure de fin estimée</label>
            <input
                type="time"
                id="end-time"
                name="end-time"
                required
            >
        </div>

        <div>
            <label for="min-players">Nombre minimum de joueurs</label>
            <input
                type="number"
                id="min-players"
                name="min-players"
                min="1"
                required
            >
        </div>

        <div>
            <label for="max-players">Nombre maximum de joueurs</label>
            <input
                type="number"
                id="max-players"
                name="max-players"
                min="1"
                required
            >
        </div>

        <button type="submit" id="submit-proposal">
            Envoyer la proposition
        </button>

        <p id="proposal-message"></p>
    </form>

    <section>
        <h2>Mes propositions</h2>

        <div id="my-proposals">
            <p>Chargement...</p>
        </div>
    </section>
</main>

<script type="module" src="../js/auth.js"></script>
<script type="module" src="../js/propose.js"></script>

</body>
</html>
