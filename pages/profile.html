<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon profil - Calendar</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <nav>
            <a href="../index.html">Accueil</a>
            <a href="calendar.html">Calendrier</a>
        <a href="events.html">Événements</a>
            <a href="propose.html">Proposer</a>

            <div id="auth-menu"></div>
        </nav>
    </header>


    <main>

        <h1>Mon profil</h1>


        <section>

            <!-- ========================================= -->
            <!-- APERÇU DES PHOTOS                         -->
            <!-- ========================================= -->

            <div class="avatar-preview">

                <!-- Photo actuelle -->
                <div class="avatar-preview-item">

                    <p>Photo actuelle</p>

                    <img
                        id="profile-avatar"
                        src="../assets/images/default-avatar.png"
                        alt="Photo de profil actuelle"
                        width="120"
                        height="120"
                    >

                </div>


                <!-- Flèche -->
                <span
                    id="avatar-preview-arrow"
                    aria-hidden="true"
                    hidden
                >
                    →
                </span>


                <!-- Nouvelle photo -->
                <div
                    id="new-avatar-preview-container"
                    class="avatar-preview-item"
                    hidden
                >

                    <p>Nouvelle photo</p>

                    <img
                        id="new-avatar-preview"
                        src=""
                        alt="Aperçu de la nouvelle photo"
                        width="120"
                        height="120"
                    >

                </div>

            </div>


            <!-- ========================================= -->
            <!-- FORMULAIRE                                -->
            <!-- ========================================= -->

            <form id="profile-form">


                <!-- Photo -->
                <div>

                    <label for="avatar-file">
                        Changer la photo
                    </label>

                    <input
                        type="file"
                        id="avatar-file"
                        accept="image/jpeg,image/png,image/webp"
                    >

                </div>


                <!-- Pseudo -->
                <div>

                    <label for="pseudo">
                        Pseudo
                    </label>

                    <input
                        type="text"
                        id="pseudo"
                        name="pseudo"
                        maxlength="50"
                        required
                    >

                </div>


                <!-- Email -->
                <div>

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        readonly
                    >

                </div>


                <!-- Rôle -->
                <div>

                    <label for="role">
                        Rôle
                    </label>

                    <input
                        type="text"
                        id="role"
                        name="role"
                        readonly
                    >

                </div>


                <!-- Enregistrer -->
                <button type="submit">
                    Enregistrer
                </button>


            </form>


            <!-- Message -->
            <p id="profile-message"></p>


        </section>

    </main>


    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/profile.js"></script>

</body>
</html>
