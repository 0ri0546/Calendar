<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon profil - Calendar</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <nav>
            <a href="../index.html">Accueil</a>
            <a href="calendar.html">Calendrier</a>
            <a href="propose.html">Proposer</a>

            <div id="auth-menu"></div>
        </nav>
    </header>

    <main>
        <h1>Mon profil</h1>

        <section>
            <img
                id="profile-avatar"
                src="../assets/images/default-avatar.png"
                alt="Photo de profil"
                width="120"
                height="120"
            >

            <form id="profile-form">

                <div>
                    <label for="pseudo">Pseudo</label>

                    <input
                        type="text"
                        id="pseudo"
                        name="pseudo"
                        maxlength="50"
                        required
                    >
                </div>

                <div>
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        readonly
                    >
                </div>

                <div>
                    <label for="role">Rôle</label>

                    <input
                        type="text"
                        id="role"
                        name="role"
                        readonly
                    >
                </div>

                <button type="submit">
                    Enregistrer
                </button>

            </form>

            <p id="profile-message"></p>
        </section>
    </main>

    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/profile.js"></script>

</body>
</html>
